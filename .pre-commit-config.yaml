# .pre-commit-config.yaml
repos:
-   repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
    -   id: nbstripout
        files: ".ipynb$"

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        args: ['--maxkb=5000']
    -   id: debug-statements
    -   id: check-merge-conflict

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.10
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
    -   id: ruff-format

-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    -   id: codespell

-   repo: local
    hooks:
    # Use the Pixi dev-env binaries directly so the hooks work even when git
    # invokes pre-commit outside an activated Pixi shell (bare `ty`/`python`
    # would not be on PATH). Requires `pixi install -e dev`.
    -   id: ty
        name: ty type check
        entry: .pixi/envs/dev/bin/ty check
        language: system
        types: [python]
        pass_filenames: false
    -   id: ascii-only
        name: ASCII-only source (no Unicode; use plain text or LaTeX)
        entry: .pixi/envs/dev/bin/python scripts/check_ascii.py
        language: system
        types_or: [python, markdown]

-   repo: meta
    hooks:
    -   id: check-hooks-apply
    -   id: check-useless-excludes
