[project]
name = "smi"
version = "0.1.0"
description = "Self-Mixing Interferometry for Rapid Vibration/Acoustic Spectrograms"
authors = [
    {name = "Nolan Peard", email = "nolan.peard@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    # This machine (old Intel Mac) is locked to the last x86-64 macOS PyTorch
    # wheels (2.2.x), which are built against the NumPy 1.x C-ABI. NumPy 2.x
    # therefore breaks torch ("Failed to initialize NumPy: _ARRAY_API not
    # found") and segfaults the test suite -- so NumPy is held below 2.
    "numpy>=1.26,<2",
    "matplotlib",
    "numba",
    "torch>=2.2,<2.3",
    "lightning",
    "h5py",
    "tqdm",
    "pyyaml",
    "scipy",
]

[project.urls]
"Homepage" = "https://github.com/npeard/smi"
"Bug Tracker" = "https://github.com/npeard/smi/issues"

[build-system]
requires = ["flit_core>=3.9.0,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--verbose"
filterwarnings = [
    # Ignore external package warnings
    "ignore::UserWarning:torch.*",
    "ignore::DeprecationWarning:torch.*",
    "ignore::FutureWarning:torch.*",
    "ignore::UserWarning:numpy.*",
    "ignore::DeprecationWarning:numpy.*",
    "ignore::UserWarning:scipy.*",
    "ignore::DeprecationWarning:scipy.*",
    "ignore::UserWarning:matplotlib.*",
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::UserWarning:lightning.*",
    "ignore::DeprecationWarning:lightning.*",
    "ignore::FutureWarning:lightning.*",
    "ignore::UserWarning:numba.*",
    "ignore::DeprecationWarning:numba.*",
    # Keep warnings from your own package (as warnings, not errors)
    "default::Warning:smi.*",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=3.0",
    "pytest-xdist>=2.5",
    "pytest-benchmark",
]
dev = [
    "pytest>=8.0.0",
    "ruff",
    "codespell",
    "pre-commit",
    "nbstripout",
    "ty",             # Type checking
    "bandit",         # Security linting
    "coverage[toml]", # Coverage with pyproject.toml support
    "marimo",
    "lmfit",
    "uncertainties",
    "schemdraw",
]

[tool.flit.module]
name = "smi"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "F", "E", "W", "C90", "I", "D", "UP", "YTT", "ANN", "BLE", "B", "A", "C4", "FA",
    "INP", "NPY201", "PIE", "T20", "PYI", "PT", "RSE", "RET", "SLF", "SIM", "INT",
    "ARG", "PTH", "PL", "TRY", "FLY", "NPY", "RUF", "S", "N", "PERF", "FURB",
]
extend-select = ["D204", "D400", "D404", "D406", "D410"]
ignore = [
    # Import-related (keep for __init__.py files)
    "F403", "F405",
    # Style preferences
    "E741",  # Ambiguous variable names (sometimes necessary in scientific code)
    # Documentation (reasonable for scientific/research code)
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "D205", "D405", "D417",
    # Type annotations (reasonable choices)
    "ANN002", "ANN003", "ANN401",
    # Argument usage (common in scientific APIs)
    "ARG001",
    # Return style preference
    "RET505",
    # Exception handling (reasonable for research code)
    "TRY003",
    # Complexity (reasonable limits for scientific code)
    "PLR0913", "PLR2004",
    # Private access (sometimes needed for scientific libraries)
    "SLF001",
    # Security (may need adjustment based on your needs)
    "S101",  # Use of assert (common in scientific code)
    "S311",  # Random generators (often fine for scientific use)
    # Naming (scientific computing often uses uppercase for matrices/operators)
    "N803", # Argument names should be lowercase (conflicts with math notation for matrices)
    "N806", "N802", # Variable names should be lowercase (conflicts with math notation)
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"docs/**.py" = ["INP001", "ARG001", "ANN"]
"conftest.py" = ["ANN"]
"tests/**.py" = ["ANN", "INP001"]
# Marimo notebooks define imports inside reactive cells (PLC0415 is expected).
"notebooks/**.py" = ["T201", "ANN", "INP001", "E501", "B018", "PLR0915", "PTH123", "F841", "PLC0415"]
"*.ipynb" = ["ALL"]
"scripts/check_ascii.py" = ["S603", "S607", "T201"]
"tests/plot_waveforms.py" = ["PLR0915", "E501"]
"smi/redpitaya/manager.py" = ["C901", "PLR0912", "PLR0915"]
"smi/redpitaya/scpi.py" = ["C901", "PLR0912", "PLR0915", "E501"]
"smi/analysis/inspect_data.py" = ["PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = ".git,*.ipynb"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
numba = "*"
polars = ">=1.0"
# Held below 2 to stay ABI-compatible with the torch 2.2 wheels (see the
# dependencies note above); also keeps the conda solve from pulling NumPy 2.x.
numpy = ">=1.26,<2"
# ruff/codespell live in the default env so the `format`/`lint`/`spell` tasks
# (defined under [tool.pixi.tasks], which runs in the default env) use the
# pinned, lockfile-backed tools instead of whatever happens to be on PATH.
ruff = ">=0.15,<0.16"
codespell = "*"

[tool.pixi.pypi-dependencies]
smi = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
pre-commit = "*"
nbstripout = "*"
ty = "*"
bandit = "*"
marimo = "*"
lmfit = "*"
uncertainties = "*"
schemdraw = "*"

[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=8.0"
pytest-cov = ">=3.0"
pytest-xdist = ">=2.5"
pytest-benchmark = "*"
coverage = { version = "*", extras = ["toml"] }

# Hyperparameter / architecture search (smi/analysis/tune_search.py). Included
# in every test-running env so the search pathway is exercised on CPU in CI as
# well as on the GPU rig. See docs/hyperparameter-search-pipeline-design.md.
[tool.pixi.feature.tune.pypi-dependencies]
ray = { version = ">=2.9", extras = ["tune"] }
optuna = "*"

[tool.pixi.environments]
# The default env includes the test feature so the `test`/`all` tasks (defined
# under [tool.pixi.tasks], which run in the default env) have pytest available.
# `tune` is everywhere so the Ray search path is import- and test-able in CI.
default = { features = ["test", "tune"], solve-group = "default" }
dev = { features = ["dev", "test", "tune"], solve-group = "default" }
test = { features = ["test", "tune"], solve-group = "default" }

[tool.pixi.tasks]
format = "ruff format . && ruff check --fix ."
lint = "ruff check ."
ascii = "python scripts/check_ascii.py"
# `python -m pytest` (not bare `pytest`) so it runs via the env's interpreter.
test = "python -m pytest"
spell = "python -m codespell_lib ."
precommit = "pre-commit run --all-files"

[tool.pixi.feature.dev.tasks]
typecheck = "ty check"
all = { depends-on = ["format", "lint", "ascii", "typecheck", "test"] }

[tool.ty.environment]
python-version = "3.12"
# Resolve third-party imports against the dev pixi environment explicitly, so
# `ty` is deterministic whether invoked via `pixi run typecheck` (env activated)
# or directly by the pre-commit hook (`.pixi/envs/dev/bin/ty`, env not active).
python = ".pixi/envs/dev"

[tool.ty.src]
# notebooks/ are exploratory marimo apps (like .ipynb, already excluded) with
# optional-only deps (e.g. torchview); they are not type-gated library code.
exclude = [".pixi", "**/*.ipynb", "notebooks/**"]

# Rules dominated by PyTorch / scientific-library typing gaps (incomplete third-
# party stubs, autograd Function patterns). Downgraded so the high-signal rules
# stay actionable; promote back to "error" individually as stubs improve.
[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
invalid-method-override = "ignore"
not-subscriptable = "ignore"
invalid-type-form = "ignore"
possibly-missing-submodule = "ignore"

[tool.coverage.run]
source = ["smi"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]
